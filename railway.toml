# Railway deployment config.
# Build from the Dockerfile in deploy/. The container entrypoint runs the
# persona/campaign runner (see deploy/entrypoint.sh).
#
# Dashboard setup required (one time):
#   1. Variables: set X_AUTH_TOKEN (required). For RUN_MODE=persona also set
#      ANTHROPIC_API_KEY. Optional: RUN_MODE (arc|persona), PERSONA, ARC_START_DATE.
#   2. Volume: mount a volume at /app/data so the X session cookie and campaign
#      state survive restarts and redeploys.

[build]
builder = "dockerfile"
dockerfilePath = "deploy/Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
