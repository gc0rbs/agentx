# Railway deployment config.
# Build from the Dockerfile in deploy/. The container entrypoint runs the
# persona runner (see deploy/entrypoint.sh).
#
# Dashboard setup required (one time):
#   1. Variables: set X_AUTH_TOKEN and ANTHROPIC_API_KEY (both required).
#      Optional: PERSONA (default: hoodintel), PROXY_URL.
#   2. Volume: mount a volume at /app/data so the X session cookie and runner
#      state survive restarts and redeploys.

[build]
builder = "dockerfile"
dockerfilePath = "deploy/Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
