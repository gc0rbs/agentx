# Plain-VPS / local Docker alternative to Railway.
#
#   cd deploy
#   cp .env.example .env    # then fill in X_AUTH_TOKEN + ANTHROPIC_API_KEY
#   docker compose up -d --build
#   docker compose logs -f
#
# The named volume persists the X session cookie and runner state across restarts.

services:
  runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      PERSONA: ${PERSONA:-hoodintel}
    volumes:
      - runner-data:/app/data
    restart: unless-stopped

volumes:
  runner-data:
